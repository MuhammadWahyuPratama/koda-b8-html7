<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/requirejs@2.3.8/require.min.js"></script>
    <script src="src/lib/app.js"></script>
    <title>Calculator ui</title>
  </head>
  <body>
    <header class="navbar">
      <h1>Calculator UI</h1>
    </header>

    <section>
      <div class="calculator">
        <div class="darkmood">
          <div class="bttn"><button></button></div>
        </div>
        <div class="display" id="display">0</div>

        <div class="del">DEL</div>
        <div class="edisi">Limited edition</div>
        <div class="buttons">
          <button value="7" id="7">7</button>
          <button value="8" id="8">8</button>
          <button value="9" id="9">9</button>
          <button  value="/" class="math">/</button>

          <button value="4" id="4">4</button>
          <button value="5" id="5">5</button>
          <button value="6" id="6">6</button>
          <button value="-" class="math">-</button>

          <button value="1" id="1">1</button>
          <button value="2" id="2">2</button>
          <button value="3" id="3">3</button>
          <button value="x" class="math">x</button>

          <button>.</button>
          <button value="0" class="nol">0</button>
          <button value="+" class="math">+</button>
          <button value="=" class="equal">=</button>
        </div>
      </div>
    </section>
  </body>
</html>
